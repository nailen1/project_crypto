version: "3.8"

services:
  # Single container with all crypto ETL services
  project-crypto:
    build:
      context: .
      args:
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: ${DB_NAME}
    container_name: container-crypto
    restart: unless-stopped
    ports:
      - "8889:8888" # Jupyter
      - "5432:5432" # PostgreSQL
      - "5050:5050" # PgAdmin
    volumes:
      - .:/app
      - postgres_data:/var/lib/postgresql/data
      - pgadmin_data:/var/lib/pgadmin
    environment:
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  quant-network:
    driver: bridge
